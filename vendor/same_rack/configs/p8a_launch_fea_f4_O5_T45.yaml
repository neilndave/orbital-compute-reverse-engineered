        - {tube: 0, y_frac: 0.833333, dofs: [1, 2, 3]}
        - {tube: 1, y_frac: 0.833333, dofs: [1, 2, 3]}
        - {tube: 2, y_frac: 0.833333, dofs: [1, 2, 3]}
        - {tube: 3, y_frac: 0.833333, dofs: [1, 2, 3]}
