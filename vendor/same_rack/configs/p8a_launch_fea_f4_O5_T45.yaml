loads:                   # quasi-static inertial load factors acting at the panel (rigid-body, payload-CG envelope). Positive axial = compressive (guide convention).
  # (C) Starship Payload Users Guide v1 (2020), Fig. 5 "Payload maximum design load factors" (envelope read by eye; https://newspaceeconomy.ca/wp-content/uploads/2022/10/starship_users_guide_v1.pdf,
  #     "maximum expected design load factors for a single payload"; real loads need a coupled-loads analysis). Corner values cross-checked against the Falcon 9 / Falcon Heavy guide Table 5-3
  #     (>1,800 kg class, limit level, no qualification factor): (6.0, 0.5), (3.5, 2.0), (-1.5, 2.0), (-2.0, 0.5) axial, lateral g (https://www.spacex.com/media/falcon-users-guide-2021-09.pdf).
  #     Confidence: medium that the Starship polygon equals these corners (eye reading plus the Falcon match); LOW that the 2020 guide applies to the current Starship V3.
  corners:
    - {name: max_axial,    axial_g: 6.0,  lateral_g: 0.5}
    - {name: max_lateral,  axial_g: 3.5,  lateral_g: 2.0}
    - {name: tension_lat,  axial_g: -1.5, lateral_g: 2.0}
    - {name: max_tension,  axial_g: -2.0, lateral_g: 0.5}
  axial_axis: z          # panel normal = stack axis (ASSUMPTION: panels ride stacked flat, normal to the thrust line)
  lateral_dirs_deg_step: 15   # lateral vector swept around the panel plane (x across the width, y along the tubes)
  factor_of_safety_yield: 1.25   # (E) bracketed by NASA-STD-5001B yield 1.25 / ultimate 1.4 and Falcon guide Table 6-1 yield 1.10 / ultimate 1.25 (cited in docs/P8A_LAUNCH_FEA.md)
  sigma_y_Pa: 241.0e+6    # (C) 6061-T6 sheet minimum yield, ASTM B209 via gneealuminum.com (as configs/mass_gaps.yaml)
  amplification_sensitivity: [1.0, 2.0]   # (E) local amplification of the payload-CG factors at the panel (guide gives none); 2.0 is a screening sensitivity, not a source value
