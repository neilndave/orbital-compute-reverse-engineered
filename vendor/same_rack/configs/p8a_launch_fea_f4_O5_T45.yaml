# T45 / : THIS COPY holds the stack_O5 panel (0.3634 x 2.9446 m, 4 tubes, 216 panels, 5.7125 kg) in place of the 45 C baseline panel; geometry from results/full3d/optimized_design_T45.json (exported by experiments/knobs/export_stack_design_T45.py)
# P14 45 C BASELINE variant of configs/p8a_launch_fea_f4.yaml (use P8A_VARIANT=_f4_T45): only the panel geometry, wall, header/stub and panel mass change; loads, mounts (y_frac layouts scale with the panel length) and mesh are as the 70 C file.
# P8a-F4: the F4 full-system optimum panel (4 tubes, 3.0 m).  Derived from p8a_launch_fea.yaml (the P6 panel).
# P8a CalculiX quasi-static launch-load FEA of ONE radiator panel and its mounts.  IDEALIZED, a SCREENING analysis, not a sign-off.
# Tags: (C) cited public source, (E) ESTIMATE / engineering judgement, (A) ASSUMPTION the user has not defined (easy to change here).
# Load factors live in configs/mass_gaps.yaml (launch_loads); this file holds the model, the mount layout and the run settings.
geometry:
  design_json: results/full3d/optimized_design_T45.json   # P14 45 C baseline: F4 optimum panel 0.3900 x 2.7976 m, 4 tubes, 264 panels as built (the 70 C panel is configs/p8a_launch_fea_f4.yaml)
  tube_wall_m: 0.0023307936397516443                   # (E) from cad.build_panel on the 45 C design (experiments/p8a_launch_fea/derive_cad_inputs.py): wall that makes tubes+headers+stubs = the optimiser's lump (70 C: 1.8135 mm)
  header_kg: 0.21536484409994383                      # (E) CAD, both headers; carried as mass on the tube end rows (conservative: no header stiffness)
  stub_kg: 0.009097438645579365                       # (E) CAD, both stubs
  sheet_t_scale: 1.0                                  # sheet thickness multiplier (sensitivity)
  panel_kg_total: 5.712544020972292                          # 45 C panel mass from design_tag.summary() (CAD metal 2.346 kg + 4.2 kg/m2 overhead on both faces, as the 70 C 12.8717 kg)
material:                                             # 6061-T6 sheet and tube, as configs/mass_gaps.yaml launch_loads
  E_Pa: 68.9e+9
  nu: 0.33
  rho_kg_m3: 2700.0
mesh:
  ny_el: 150             # elements along the 2.798 m length (18.7 mm; 70 C: 20 mm)
  n_edge: 2              # sheet elements across each outer strip
  n_gap: 4               # sheet elements across each strip between tubes
  t_bin_m: 0.000002        # sheet thickness is binned to this step to limit the number of sections
mounts:                  # ASSUMPTION (A): the author has not defined the supports.  Pads sit on the BOTTOM face of the chosen tubes.
  label: ASSUMPTION
  pad_len_m: 0.06        # pad footprint along the tube; held on the centre line of the tube bottom face (corner nodes are shell knots and are left free)
  end_inset_m: 0.04      # distance of the end pads' centres from the tube ends
  active: stack_7station   # BASELINE since 2026-10-30 00:11 Taipei (author adopted the 35 Hz secondary-structure target, Falcon Payload User Guide sec 5.3: 7 stations = 36.98 Hz FEA)
  layouts:
    stack_all_tubes:     # SENSITIVITY (the old 3-station baseline, fails guide loads):  the panel rides in a stack and a pad row (bearing strip / rail) touches ALL four tubes at three stations
      pads:
        - {tube: 0, y_frac: 0.0, dofs: [1, 2, 3]}
        - {tube: 1, y_frac: 0.0, dofs: [1, 2, 3]}
        - {tube: 2, y_frac: 0.0, dofs: [1, 2, 3]}
        - {tube: 3, y_frac: 0.0, dofs: [1, 2, 3]}
        - {tube: 0, y_frac: 0.5, dofs: [1, 2, 3]}
        - {tube: 1, y_frac: 0.5, dofs: [1, 2, 3]}
        - {tube: 2, y_frac: 0.5, dofs: [1, 2, 3]}
        - {tube: 3, y_frac: 0.5, dofs: [1, 2, 3]}
        - {tube: 0, y_frac: 1.0, dofs: [1, 2, 3]}
        - {tube: 1, y_frac: 1.0, dofs: [1, 2, 3]}
        - {tube: 2, y_frac: 1.0, dofs: [1, 2, 3]}
        - {tube: 3, y_frac: 1.0, dofs: [1, 2, 3]}
    stack_4station:      # SENSITIVITY (fix option): one extra station pair, four stations (thirds) on all four tubes -> 1.0 m spans
      pads:
        - {tube: 0, y_frac: 0.0, dofs: [1, 2, 3]}
        - {tube: 1, y_frac: 0.0, dofs: [1, 2, 3]}
        - {tube: 2, y_frac: 0.0, dofs: [1, 2, 3]}
        - {tube: 3, y_frac: 0.0, dofs: [1, 2, 3]}
        - {tube: 0, y_frac: 0.3333333333, dofs: [1, 2, 3]}
        - {tube: 1, y_frac: 0.3333333333, dofs: [1, 2, 3]}
        - {tube: 2, y_frac: 0.3333333333, dofs: [1, 2, 3]}
        - {tube: 3, y_frac: 0.3333333333, dofs: [1, 2, 3]}
        - {tube: 0, y_frac: 0.6666666667, dofs: [1, 2, 3]}
        - {tube: 1, y_frac: 0.6666666667, dofs: [1, 2, 3]}
        - {tube: 2, y_frac: 0.6666666667, dofs: [1, 2, 3]}
        - {tube: 3, y_frac: 0.6666666667, dofs: [1, 2, 3]}
        - {tube: 0, y_frac: 1.0, dofs: [1, 2, 3]}
        - {tube: 1, y_frac: 1.0, dofs: [1, 2, 3]}
        - {tube: 2, y_frac: 1.0, dofs: [1, 2, 3]}
        - {tube: 3, y_frac: 1.0, dofs: [1, 2, 3]}
    stack_5station:      # SENSITIVITY (fix option): two extra stations (quarter points) on all four tubes
